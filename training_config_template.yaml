output_path: trained_models/delete_me
task_type: training
data:
    train_split:
        dataset_type: grid
        path: datasets/grid_without_bc_sentences
        start: 0
        end: 1.
        noise: true
        scaling: 1.
    test_split:
        dataset_type: grid_bc
        path: datasets/grid_bc_without_duplicates
        start: 0
        end: 0.2
        noise: false
        scaling: 1.
model:
    name: whisper
    model_type: large-v3-turbo
    path: null
debug: false
perform_training: true
learning_rate: 1.0e-05
num_train_epochs: 2
batch_size: 16
save_and_eval_steps: 200
warmup_steps: 500

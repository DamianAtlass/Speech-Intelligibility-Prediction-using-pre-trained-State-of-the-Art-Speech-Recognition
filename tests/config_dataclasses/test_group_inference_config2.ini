[Config]
model = whisper
model_type = tiny,base,turbo
model_path = trained_models/training_output_test_folder
output_path = inferences/tmp

dataset_type = grid
dataset_path = datasets/grid/
add_noise = False
train_split = 0.7
test_split = 0.2
val_split = 0.1

#for debugging
dataset_scaling = 0.005
debug = True

[InferenceConfig]
extract_logprobs = True
word_timestamps = True
beam_size = 2, 5, 7
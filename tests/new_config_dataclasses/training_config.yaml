output_path: tests/new_config_dataclasses
model:
  name: whisper
  model_type: base
  model_path: trained_models/foo
data:
  train_split:
    noise: True
    dataset_type: grid
    path: grid/path
    start: 0.1
    end: 0.3
    scaling: 1
  test_split:
    noise: True
    dataset_type: grid
    path: grid/path
    start: 100
    end: 4000
    scaling: 1

    noise: True
    dataset_type: grid_bc
    path: grid_bc/path
    start: 0.
    end: 1.
    scaling: 1
task_type: training
perform_training: True
learning_rate: 1e-05
num_train_epochs: 5
batch_size: 16
save_and_eval_per_epoch: 16
warmup_steps: 500
debug: False